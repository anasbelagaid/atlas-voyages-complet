name: Vérification du projet

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Build Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
        working-directory: frontend
      - name: Auditer les dépendances
        run: npm audit
        working-directory: frontend
      - name: Compiler en production
        run: npm run build
        working-directory: frontend

  backend:
    name: Tests API Laravel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer PHP et extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, xml, curl
          coverage: none
      - name: Installer les dépendances Composer
        run: composer install --working-dir=backend --no-interaction --prefer-dist
      - name: Auditer les dépendances
        run: composer audit --working-dir=backend
      - name: Lancer les tests API
        run: composer test
        working-directory: backend
